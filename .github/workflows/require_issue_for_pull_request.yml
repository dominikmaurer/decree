name: Require linked issue

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  check-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Check for issue reference
        run: |
          BODY="${{ github.event.pull_request.body }}"

          echo "PR body:"
          echo "$BODY"

          if echo "$BODY" | grep -Eiq "(#|fixes|closes)[[:space:]]*#[0-9]+"; then
            echo "OK"
            exit 0
          fi

          echo "Missing issue reference"
          exit 1
