name: Only develop -> master

on:
  pull_request:
    branches:
      - master

jobs:
  check-source-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Verify source branch
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "❌ Pull requests to master are only allowed from the develop branch."
            exit 1
          fi

          echo "✅ Source branch is develop."